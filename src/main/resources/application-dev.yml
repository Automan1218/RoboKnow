  primary-org: default
  org-tags: default,admin

file:
  parsing:
    chunk-size: 1024 # 父块最大字符数（父子分块时作为喂给 LLM 的上下文块）
    chunk-overlap-ratio: 0.1 # 相邻文本块重叠比例
    parent-child-enabled: true # 父子分块开关：子块向量召回 + 父块上下文回溯
    child-chunk-size: 256 # 子块最大字符数（向量化/召回单元，须明显小于 chunk-size）

