name: CI

on:
  push:
    branches:
      - main
      - 'dev/**'
  pull_request:
    branches:
      - main
      - 'dev/**'
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * 0'

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'

jobs:
  backend-build-and-test:
    name: Backend build, unit test, coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Run backend unit tests with JaCoCo
        run: >
          mvn -B
          org.jacoco:jacoco-maven-plugin:0.8.12:prepare-agent
          "-Dtest=ConversationTurnDispatcherTest,ParseServiceUnitTest,FileTypeValidationServiceTest,AgentStopServiceTest,ToolRegistryTest,LogUtilsTest,ChatHandlerCoverageTest,FirstPhaseControllerTest,AuthControllerTest,UserControllerTest,SearchControllerTest,ChatControllerTest,ConversationControllerTest,AiUsageControllerTest,AiTokenUsageServiceTest"
          test
          org.jacoco:jacoco-maven-plugin:0.8.12:report
          org.jacoco:jacoco-maven-plugin:0.8.12:check@check

      - name: Package backend
        run: mvn -B -DskipTests package

      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            target/surefire-reports/**
            target/site/jacoco/**
          if-no-files-found: warn

      - name: Summarize backend reports
        if: always()
        shell: bash
        run: |
          {
            echo "## Backend reports"
            echo "- Artifact: backend-test-reports"
            echo "- Unit test XML: target/surefire-reports"
            echo "- Phase 1 coverage HTML: target/site/jacoco/index.html"
            echo "- Coverage gate: line coverage >= 50%"
          } >> "$GITHUB_STEP_SUMMARY"
          find target/surefire-reports target/site/jacoco -maxdepth 2 -type f 2>/dev/null | sort | head -100 || true

  backend-integration-test:
    name: Backend integration test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: RoboKnow2025
          MYSQL_DATABASE: RoboKnow
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pRoboKnow2025"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Elasticsearch image with IK analyzer
        run: docker build -t roboknow-es-ik:8.10.4 docker/elasticsearch-ik

      - name: Start Elasticsearch with IK analyzer
        run: >
          docker run -d
          --name roboknow-es
          -p 9200:9200
          -e ELASTIC_PASSWORD=RoboKnow2025
          -e discovery.type=single-node
          -e xpack.security.enabled=true
          -e xpack.security.http.ssl.enabled=false
          -e ES_JAVA_OPTS="-Xms1g -Xmx1g"
          roboknow-es-ik:8.10.4

      - name: Wait for Elasticsearch
        shell: bash
        run: |
          for i in {1..40}; do
            if curl -fsS -u elastic:RoboKnow2025 http://localhost:9200/_cluster/health >/dev/null; then
              curl -fsS -u elastic:RoboKnow2025 http://localhost:9200/_analyze \
                -H 'Content-Type: application/json' \
                -d '{"analyzer":"ik_smart","text":"integration test"}' >/dev/null
              exit 0
            fi
            docker logs --tail 30 roboknow-es || true
            sleep 10
          done
          docker logs roboknow-es || true
          exit 1

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Run backend integration tests
        env:
          SPRING_PROFILES_ACTIVE: docker
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/RoboKnow?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: RoboKnow2025
          SPRING_DATA_REDIS_HOST: localhost
          SPRING_DATA_REDIS_PORT: 6379
          SPRING_DATA_REDIS_PASSWORD: ''
          SPRING_KAFKA_ENABLED: 'false'
          ELASTICSEARCH_HOST: localhost
          ELASTICSEARCH_PORT: 9200
          ELASTICSEARCH_USERNAME: elastic
          ELASTICSEARCH_PASSWORD: RoboKnow2025
        run: >
          mvn -B
          "-Dtest=RoboKnowApplicationTests,ParseServiceTest,UploadServicePerformanceTest"
          test

      - name: Upload integration test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-integration-test-reports
          path: target/surefire-reports/**
          if-no-files-found: warn

      - name: Upload Elasticsearch logs
        if: always()
        run: docker logs roboknow-es > elasticsearch-ci.log || true

      - name: Archive Elasticsearch logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: elasticsearch-integration-logs
          path: elasticsearch-ci.log
          if-no-files-found: warn

      - name: Summarize integration reports
        if: always()
        shell: bash
        run: |
          {
            echo "## Integration test reports"
            echo "- Artifact: backend-integration-test-reports"
            echo "- Elasticsearch logs: elasticsearch-integration-logs"
            echo "- Integration test XML: target/surefire-reports"
          } >> "$GITHUB_STEP_SUMMARY"
          find target/surefire-reports -maxdepth 1 -type f 2>/dev/null | sort | head -100 || true

  frontend-quality:
    name: Frontend typecheck, lint, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Typecheck frontend
        working-directory: frontend
        continue-on-error: true
        run: pnpm typecheck

      - name: Lint frontend
        working-directory: frontend
        continue-on-error: true
        run: pnpm exec eslint .

      - name: Record frontend baseline status
        if: always()
        run: |
          {
            echo "## Frontend checks"
            echo "- Production build is the blocking frontend gate."
            echo "- Typecheck and lint run for visibility and currently report existing repository baseline issues."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build frontend
        working-directory: frontend
        run: pnpm build

  backend-static-analysis:
    name: Backend static analysis
    runs-on: ubuntu-latest
    needs: backend-build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Run Checkstyle report
        run: >
          mvn -B
          org.apache.maven.plugins:maven-checkstyle-plugin:3.5.0:checkstyle

      - name: Run SpotBugs report
        run: >
          mvn -B
          com.github.spotbugs:spotbugs-maven-plugin:4.8.6.6:spotbugs

      - name: Upload static analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-static-analysis-reports
          path: |
            target/checkstyle-result.xml
            target/site/checkstyle.html
            target/spotbugsXml.xml
            target/site/spotbugs.html
          if-no-files-found: warn

      - name: Summarize static analysis reports
        if: always()
        shell: bash
        run: |
          {
            echo "## Static analysis reports"
            echo "- Artifact: backend-static-analysis-reports"
            echo "- Checkstyle: target/checkstyle-result.xml, target/site/checkstyle.html"
            echo "- SpotBugs: target/spotbugsXml.xml, target/site/spotbugs.html"
          } >> "$GITHUB_STEP_SUMMARY"
          find target -maxdepth 3 -type f \( -iname '*checkstyle*' -o -iname '*spotbugs*' \) 2>/dev/null | sort || true

  dependency-vulnerability-scan:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Run OWASP Dependency-Check
        continue-on-error: true
        shell: bash
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          args=(
            -B
            org.owasp:dependency-check-maven:10.0.4:check
            -Dformat=HTML,JSON,SARIF
            -DfailBuildOnCVSS=11
          )
          if [ -n "$NVD_API_KEY" ]; then
            args+=("-DnvdApiKey=$NVD_API_KEY")
          else
            echo "::warning::NVD_API_KEY is not configured; Dependency-Check may be slow or rate-limited."
          fi
          mvn "${args[@]}"

      - name: Upload dependency scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-vulnerability-reports
          path: target/dependency-check-report.*
          if-no-files-found: warn

      - name: Upload Dependency-Check SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: target/dependency-check-report.sarif
        continue-on-error: true

      - name: Summarize dependency scan reports
        if: always()
        shell: bash
        run: |
          {
            echo "## Dependency vulnerability reports"
            echo "- Artifact: dependency-vulnerability-reports"
            echo "- SARIF upload: target/dependency-check-report.sarif"
            echo "- This job runs on workflow_dispatch and weekly schedule, not on every push."
          } >> "$GITHUB_STEP_SUMMARY"
          find target -maxdepth 1 -type f -name 'dependency-check-report.*' 2>/dev/null | sort || true

  docker-image-build:
    name: Docker image build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - backend-build-and-test
      - backend-integration-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Package backend jar
        run: mvn -B -DskipTests package

      - name: Build backend Docker image
        run: docker build -t roboknow-backend:${{ github.sha }} .

      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          scan-type: image
          image-ref: roboknow-backend:${{ github.sha }}
          format: sarif
          output: trivy-backend-image.sarif
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          scanners: vuln

      - name: Upload backend image Trivy SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-backend-image.sarif
          category: trivy-backend-image

      - name: Scan frontend dependencies with Trivy
        if: always()
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          scan-type: fs
          scan-ref: frontend
          format: sarif
          output: trivy-frontend-fs.sarif
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          scanners: vuln

      - name: Upload frontend dependency Trivy SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-frontend-fs.sarif
          category: trivy-frontend-fs

      - name: Upload Trivy scan reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: trivy-scan-reports
          path: |
            trivy-backend-image.sarif
            trivy-frontend-fs.sarif
          if-no-files-found: warn

      - name: Summarize Docker image and Trivy scans
        if: always()
        run: |
          echo "## Docker image" >> "$GITHUB_STEP_SUMMARY"
          echo "- Built image tag: roboknow-backend:${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "## Trivy vulnerability scans" >> "$GITHUB_STEP_SUMMARY"
          echo "- Backend image scan report: trivy-backend-image.sarif (category: trivy-backend-image)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Frontend dependency scan report: trivy-frontend-fs.sarif (category: trivy-frontend-fs)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artifact: trivy-scan-reports" >> "$GITHUB_STEP_SUMMARY"
          echo "- Full results: repo Security tab > Code scanning alerts" >> "$GITHUB_STEP_SUMMARY"

  sonar-quality-gate:
    name: SonarQube analysis
    runs-on: ubuntu-latest
    needs: backend-build-and-test
    if: ${{ vars.SONAR_HOST_URL != '' }}
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Run tests with coverage for SonarQube
        if: ${{ env.SONAR_TOKEN != '' }}
        run: >
          mvn -B
          org.jacoco:jacoco-maven-plugin:0.8.12:prepare-agent
          "-Dtest=ConversationTurnDispatcherTest,ParseServiceUnitTest,FileTypeValidationServiceTest,AgentStopServiceTest,ToolRegistryTest,LogUtilsTest,ChatHandlerCoverageTest,FirstPhaseControllerTest,AuthControllerTest,UserControllerTest,SearchControllerTest,ChatControllerTest,ConversationControllerTest,AiUsageControllerTest,AiTokenUsageServiceTest"
          test
          org.jacoco:jacoco-maven-plugin:0.8.12:report
          org.jacoco:jacoco-maven-plugin:0.8.12:check@check

      - name: Run SonarQube analysis
        if: ${{ env.SONAR_TOKEN != '' }}
        run: >
          mvn -B
          org.sonarsource.scanner.maven:sonar-maven-plugin:5.1.0.4751:sonar
          -Dsonar.host.url=${SONAR_HOST_URL}
          -Dsonar.token=${SONAR_TOKEN}
          -Dsonar.organization=${SONAR_ORGANIZATION}
          -Dsonar.projectKey=Automan1218_RoboKnow
          -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

  quality-gate:
    name: Required CI quality gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - backend-build-and-test
      - backend-integration-test
      - frontend-quality
      - backend-static-analysis
      - docker-image-build
    steps:
      - name: Verify required jobs succeeded
        shell: bash
        run: |
          set -euo pipefail
          results=(
            "backend-build-and-test=${{ needs.backend-build-and-test.result }}"
            "backend-integration-test=${{ needs.backend-integration-test.result }}"
            "frontend-quality=${{ needs.frontend-quality.result }}"
            "backend-static-analysis=${{ needs.backend-static-analysis.result }}"
            "docker-image-build=${{ needs.docker-image-build.result }}"
          )
          printf '%s\n' "${results[@]}"
          for result in "${results[@]}"; do
            if [[ "$result" != *=success ]]; then
              echo "Required CI job did not succeed: $result"
              exit 1
            fi
          done
