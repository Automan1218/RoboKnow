name: CI

on:
  push:
    branches:
      - master
      - 'dev/**'
  pull_request:
    branches:
      - master
      - 'dev/**'
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * 0'

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '20'
  PNPM_VERSION: '9'

jobs:
  backend-build-and-test:
    name: Backend build, unit test, coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Run backend unit tests with JaCoCo
        run: >
          mvn -B
          org.jacoco:jacoco-maven-plugin:0.8.12:prepare-agent
          "-Dtest=ConversationServiceTest,ParseServiceUnitTest,FileTypeValidationServiceTest,AgentStopServiceTest,ToolRegistryTest,LogUtilsTest,ChatHandlerTest,FirstPhaseControllerTest"
          test
          org.jacoco:jacoco-maven-plugin:0.8.12:report
          org.jacoco:jacoco-maven-plugin:0.8.12:check

      - name: Package backend
        run: mvn -B -DskipTests package

      - name: Upload backend test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            target/surefire-reports/**
            target/site/jacoco/**
          if-no-files-found: warn

      - name: Summarize backend reports
        if: always()
        shell: bash
        run: |
          {
            echo "## Backend reports"
            echo "- Artifact: backend-test-reports"
            echo "- Unit test XML: target/surefire-reports"
            echo "- Phase 1 coverage HTML: target/site/jacoco/index.html"
            echo "- Coverage gate: line coverage >= 50%"
          } >> "$GITHUB_STEP_SUMMARY"
          find target/surefire-reports target/site/jacoco -maxdepth 2 -type f 2>/dev/null | sort | head -100 || true

  backend-integration-test:
    name: Backend integration test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: PaiSmart2025
          MYSQL_DATABASE: PaiSmart
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pPaiSmart2025"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Elasticsearch image with IK analyzer
        run: docker build -t paismart-es-ik:8.10.4 docker/elasticsearch-ik

      - name: Start Elasticsearch with IK analyzer
        run: >
          docker run -d
          --name paismart-es
          -p 9200:9200
          -e ELASTIC_PASSWORD=PaiSmart2025
          -e discovery.type=single-node
          -e xpack.security.enabled=true
          -e xpack.security.http.ssl.enabled=false
          -e ES_JAVA_OPTS="-Xms1g -Xmx1g"
          paismart-es-ik:8.10.4

      - name: Wait for Elasticsearch
        shell: bash
        run: |
          for i in {1..40}; do
            if curl -fsS -u elastic:PaiSmart2025 http://localhost:9200/_cluster/health >/dev/null; then
              curl -fsS -u elastic:PaiSmart2025 http://localhost:9200/_analyze \
                -H 'Content-Type: application/json' \
                -d '{"analyzer":"ik_smart","text":"integration test"}' >/dev/null
              exit 0
            fi
            docker logs --tail 30 paismart-es || true
            sleep 10
          done
          docker logs paismart-es || true
          exit 1

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Run backend integration tests
        env:
          SPRING_PROFILES_ACTIVE: docker
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/PaiSmart?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: PaiSmart2025
          SPRING_DATA_REDIS_HOST: localhost
          SPRING_DATA_REDIS_PORT: 6379
          SPRING_DATA_REDIS_PASSWORD: ''
          SPRING_KAFKA_ENABLED: 'false'
          ELASTICSEARCH_HOST: localhost
          ELASTICSEARCH_PORT: 9200
          ELASTICSEARCH_USERNAME: elastic
          ELASTICSEARCH_PASSWORD: PaiSmart2025
        run: >
          mvn -B
          "-Dtest=SmartPaiApplicationTests,ParseServiceTest,UploadServicePerformanceTest"
          test

      - name: Upload integration test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-integration-test-reports
          path: target/surefire-reports/**
          if-no-files-found: warn

      - name: Upload Elasticsearch logs
        if: always()
        run: docker logs paismart-es > elasticsearch-ci.log || true

      - name: Archive Elasticsearch logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: elasticsearch-integration-logs
          path: elasticsearch-ci.log
          if-no-files-found: warn

      - name: Summarize integration reports
        if: always()
        shell: bash
        run: |
          {
            echo "## Integration test reports"
            echo "- Artifact: backend-integration-test-reports"
            echo "- Elasticsearch logs: elasticsearch-integration-logs"
            echo "- Integration test XML: target/surefire-reports"
          } >> "$GITHUB_STEP_SUMMARY"
          find target/surefire-reports -maxdepth 1 -type f 2>/dev/null | sort | head -100 || true

  backend-static-analysis:
    name: Backend static analysis
    runs-on: ubuntu-latest
    needs: backend-build-and-test
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Run Checkstyle report
        continue-on-error: true
        run: >
          mvn -B
          org.apache.maven.plugins:maven-checkstyle-plugin:3.5.0:checkstyle

      - name: Run SpotBugs report
        continue-on-error: true
        run: >
          mvn -B
          com.github.spotbugs:spotbugs-maven-plugin:4.8.6.6:spotbugs

      - name: Upload static analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-static-analysis-reports
          path: |
            target/checkstyle-result.xml
            target/site/checkstyle.html
            target/spotbugsXml.xml
            target/site/spotbugs.html
          if-no-files-found: warn

      - name: Summarize static analysis reports
        if: always()
        shell: bash
        run: |
          {
            echo "## Static analysis reports"
            echo "- Artifact: backend-static-analysis-reports"
            echo "- Checkstyle: target/checkstyle-result.xml, target/site/checkstyle.html"
            echo "- SpotBugs: target/spotbugsXml.xml, target/site/spotbugs.html"
          } >> "$GITHUB_STEP_SUMMARY"
          find target -maxdepth 3 -type f \( -iname '*checkstyle*' -o -iname '*spotbugs*' \) 2>/dev/null | sort || true

  dependency-vulnerability-scan:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Run OWASP Dependency-Check
        continue-on-error: true
        shell: bash
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          args=(
            -B
            org.owasp:dependency-check-maven:10.0.4:check
            -Dformat=HTML,JSON,SARIF
            -DfailBuildOnCVSS=11
          )
          if [ -n "$NVD_API_KEY" ]; then
            args+=("-DnvdApiKey=$NVD_API_KEY")
          else
            echo "::warning::NVD_API_KEY is not configured; Dependency-Check may be slow or rate-limited."
          fi
          mvn "${args[@]}"

      - name: Upload dependency scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-vulnerability-reports
          path: target/dependency-check-report.*
          if-no-files-found: warn

      - name: Upload Dependency-Check SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: target/dependency-check-report.sarif
        continue-on-error: true

      - name: Summarize dependency scan reports
        if: always()
        shell: bash
        run: |
          {
            echo "## Dependency vulnerability reports"
            echo "- Artifact: dependency-vulnerability-reports"
            echo "- SARIF upload: target/dependency-check-report.sarif"
            echo "- This job runs on workflow_dispatch and weekly schedule, not on every push."
          } >> "$GITHUB_STEP_SUMMARY"
          find target -maxdepth 1 -type f -name 'dependency-check-report.*' 2>/dev/null | sort || true

  frontend-build-and-test:
    name: Frontend install, typecheck, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend typecheck
        continue-on-error: true
        run: pnpm typecheck

      - name: Build frontend
        run: pnpm build

      - name: Upload frontend build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/**
          if-no-files-found: warn

      - name: Summarize frontend artifact
        if: always()
        shell: bash
        run: |
          {
            echo "## Frontend build"
            echo "- Artifact: frontend-dist"
            echo "- Build output: frontend/dist"
          } >> "$GITHUB_STEP_SUMMARY"
          find frontend/dist -maxdepth 2 -type f 2>/dev/null | sort | head -100 || true

  docker-image-build:
    name: Docker image build
    runs-on: ubuntu-latest
    needs:
      - backend-build-and-test
      - backend-integration-test
      - frontend-build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Package backend jar
        run: mvn -B -DskipTests package

      - name: Build backend Docker image
        run: docker build -t paismart-backend:${{ github.sha }} .

      - name: Summarize Docker image
        run: |
          echo "## Docker image" >> "$GITHUB_STEP_SUMMARY"
          echo "- Built image tag: paismart-backend:${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"

  sonar-quality-gate:
    name: SonarQube analysis
    runs-on: ubuntu-latest
    needs: backend-build-and-test
    if: ${{ vars.SONAR_HOST_URL != '' }}
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Run tests with coverage for SonarQube
        if: ${{ env.SONAR_TOKEN != '' }}
        run: >
          mvn -B
          org.jacoco:jacoco-maven-plugin:0.8.12:prepare-agent
          "-Dtest=ConversationServiceTest,ParseServiceUnitTest,FileTypeValidationServiceTest,AgentStopServiceTest,ToolRegistryTest,LogUtilsTest,ChatHandlerTest,FirstPhaseControllerTest"
          test
          org.jacoco:jacoco-maven-plugin:0.8.12:report
          org.jacoco:jacoco-maven-plugin:0.8.12:check

      - name: Run SonarQube analysis
        if: ${{ env.SONAR_TOKEN != '' }}
        run: >
          mvn -B
          org.sonarsource.scanner.maven:sonar-maven-plugin:5.1.0.4751:sonar
          -Dsonar.host.url=${SONAR_HOST_URL}
          -Dsonar.token=${SONAR_TOKEN}
          -Dsonar.projectKey=PaiSmart
          -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
