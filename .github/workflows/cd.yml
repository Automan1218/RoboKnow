name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches:
      - main
  workflow_dispatch:
    inputs:
      dast_mode:
        description: 'DAST mode. Active scans require DAST_ACTIVE_SCAN_ENABLED=true and a dedicated test target.'
        required: true
        default: baseline
        type: choice
        options:
          - baseline
          - active
      dast_target_url:
        description: 'Optional target override. Leave blank to use DAST_TARGET_URL or http://EC2_HOST.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: cd-paismart
  cancel-in-progress: false

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '18'
  PNPM_VERSION: '9.15.9'
  EC2_HOST: ${{ vars.EC2_HOST }}
  EC2_SSH_PORT: ${{ vars.EC2_SSH_PORT || '22' }}

jobs:
  build-and-deploy:
    name: Build JAR and deploy with systemd
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # The first OCR start can download models and the remote health checks may
    # legitimately take several minutes. Leave enough time for diagnostics too.
    timeout-minutes: 50
    outputs:
      source-sha: ${{ steps.meta.outputs.sha }}
    steps:
      - name: Resolve source SHA
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            sha="${{ github.event.workflow_run.head_sha }}"
          else
            sha="${{ github.sha }}"
          fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Checkout verified source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.sha }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Build backend JAR
        run: mvn -B -DskipTests package

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Stage deployment bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy-bundle
          cp target/RoboKnow-*.jar deploy-bundle/app.jar.new
          cp -r frontend/dist deploy-bundle/dist
          cp -r ocr_service deploy-bundle/ocr_service
          sed 's#context: ../ocr_service#context: ./ocr_service#' \
            docs/docker-compose.yaml > deploy-bundle/docker-compose.yaml
          cp deploy/nginx.conf deploy-bundle/nginx.conf
          cp deploy/paismart.service deploy-bundle/paismart.service
          cp deploy/deploy.sh deploy-bundle/deploy.sh
          cp deploy/rollback.sh deploy-bundle/rollback.sh

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$EC2_HOST" ]]; then
            echo "::error::Repository variable EC2_HOST is required. Set it to the EC2 hostname or IP address."
            exit 1
          fi
          if [[ ! "$EC2_SSH_PORT" =~ ^[0-9]+$ ]] || (( EC2_SSH_PORT < 1 || EC2_SSH_PORT > 65535 )); then
            echo "::error::Repository variable EC2_SSH_PORT must be a valid TCP port."
            exit 1
          fi
          if [[ -z "${{ secrets.EC2_SSH_KEY }}" ]]; then
            echo "::error::Repository secret EC2_SSH_KEY is required."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -p "$EC2_SSH_PORT" -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload deployment bundle
        shell: bash
        run: |
          rsync -az -e "ssh -i ~/.ssh/ec2_key -p $EC2_SSH_PORT" \
            deploy-bundle/ "ubuntu@${EC2_HOST}:/home/ubuntu/paismart/"

      - name: Deploy with systemd
        shell: bash
        run: |
          ssh -i ~/.ssh/ec2_key -p "$EC2_SSH_PORT" \
            -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            "ubuntu@${EC2_HOST}" \
            'chmod +x /home/ubuntu/paismart/deploy.sh /home/ubuntu/paismart/rollback.sh && \
             /home/ubuntu/paismart/deploy.sh'

      - name: Collect remote diagnostics on deployment failure
        if: failure()
        continue-on-error: true
        shell: bash
        run: |
          ssh -i ~/.ssh/ec2_key -p "$EC2_SSH_PORT" \
            -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            "ubuntu@${EC2_HOST}" \
            'echo "==> paismart.service status"; \
             sudo systemctl --no-pager --full status paismart.service || true; \
             echo "==> paismart.service journal"; \
             sudo journalctl -u paismart.service -n 200 --no-pager || true; \
             echo "==> listeners on port 8081"; \
             sudo ss -ltnp "( sport = :8081 )" || true; \
             echo "==> container state"; \
             sudo docker ps -a || true; \
             echo "==> OCR health and logs"; \
             sudo docker inspect --format "{{.State.Status}} {{if .State.Health}}{{.State.Health.Status}}{{end}}" ocr-service || true; \
             sudo docker logs --tail 200 ocr-service || true'

      - name: Deployment summary
        run: |
          echo "## Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source SHA: ${{ steps.meta.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Backend: JAR managed by systemd (paismart.service)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Target: EC2 via SSH" >> "$GITHUB_STEP_SUMMARY"

      - name: Collect container runtime evidence
        shell: bash
        run: |
          ssh -i ~/.ssh/ec2_key -p "$EC2_SSH_PORT" \
            -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            "ubuntu@${EC2_HOST}" \
            'echo "==> docker ps -a"; sudo docker ps -a; \
             echo "==> service health"; \
             for container in mysql redis kafka es minio ocr-service; do \
               printf "%s: " "$container"; \
               sudo docker inspect --format "{{.State.Status}} {{if .State.Health}}{{.State.Health.Status}}{{end}}" "$container" 2>&1 || true; \
             done; \
             echo "==> OCR logs"; sudo docker logs --tail 100 ocr-service || true; \
             echo "==> backend service"; sudo systemctl --no-pager --full status paismart.service || true' \
            > container-runtime-evidence.txt

      - name: Upload container runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-runtime-evidence-${{ github.run_number }}
          path: container-runtime-evidence.txt
          if-no-files-found: warn

  dast:
    name: Dynamic application security test
    needs: build-and-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Use an explicitly configured URL where possible. EC2_HOST is a safe
      # baseline-only fallback for the existing deployment topology.
      DAST_TARGET_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.dast_target_url || vars.DAST_TARGET_URL || format('http://{0}', vars.EC2_HOST) }}
      DAST_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.dast_mode || 'baseline' }}
      DAST_ACTIVE_SCAN_ENABLED: ${{ vars.DAST_ACTIVE_SCAN_ENABLED || 'false' }}
    steps:
      - name: Checkout security reporting tools
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build-and-deploy.outputs.source-sha }}

      - name: Validate DAST authorization and target
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$DAST_TARGET_URL" =~ ^https?:// ]]; then
            echo "::error::DAST_TARGET_URL must be an http(s) URL. Configure repository variable DAST_TARGET_URL."
            exit 1
          fi
          if [[ "$DAST_MODE" == "active" && "$DAST_ACTIVE_SCAN_ENABLED" != "true" ]]; then
            echo "::error::Active DAST is disabled. It may only run against an authorized test environment after setting DAST_ACTIVE_SCAN_ENABLED=true."
            exit 1
          fi
          mkdir -p dast-reports
          printf 'target=%s\nmode=%s\ncommit=%s\n' "$DAST_TARGET_URL" "$DAST_MODE" "${{ needs.build-and-deploy.outputs.source-sha }}" > dast-reports/scan-metadata.txt

      - name: Run OWASP ZAP baseline scan
        if: ${{ env.DAST_MODE == 'baseline' }}
        shell: bash
        run: |
          docker run --rm --user root \
            -v "${{ github.workspace }}/dast-reports:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t "$DAST_TARGET_URL" -m 5 -I \
            -J /zap/wrk/zap-report.json \
            -r /zap/wrk/zap-report.html \
            -x /zap/wrk/zap-report.xml

      - name: Run OWASP ZAP active scan
        if: ${{ env.DAST_MODE == 'active' }}
        shell: bash
        run: |
          docker run --rm --user root \
            -v "${{ github.workspace }}/dast-reports:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-full-scan.py -t "$DAST_TARGET_URL" -m 10 -I \
            -J /zap/wrk/zap-report.json \
            -r /zap/wrk/zap-report.html \
            -x /zap/wrk/zap-report.xml

      - name: Produce DAST remediation delta
        if: always()
        shell: bash
        run: |
          python scripts/security/compare_security_reports.py \
            --format zap \
            --current dast-reports/zap-report.json \
            --baseline security/baselines/zap-report.json \
            --output dast-reports/remediation-delta.md \
            --output-json dast-reports/remediation-delta.json

      - name: Upload DAST reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dast-reports-${{ github.run_number }}
          path: dast-reports/**
          if-no-files-found: warn

      - name: Enforce DAST high-risk gate
        if: always()
        shell: bash
        run: |
          python scripts/security/compare_security_reports.py \
            --format zap \
            --current dast-reports/zap-report.json \
            --baseline security/baselines/zap-report.json \
            --output /tmp/dast-remediation-delta.md \
            --fail-on-high
          cat /tmp/dast-remediation-delta.md >> "$GITHUB_STEP_SUMMARY"
