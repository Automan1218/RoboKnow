name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches:
      - dev/hzy
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-roboknow
  cancel-in-progress: false

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '18'
  PNPM_VERSION: '9.15.9'

jobs:
  publish-and-deploy:
    name: Publish GHCR image and deploy to EC2
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Resolve source SHA and image name
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            sha="${{ github.event.workflow_run.head_sha }}"
          else
            sha="${{ github.sha }}"
          fi
          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/roboknow-backend:${sha}"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "Deploy image: ${image}"

      - name: Checkout verified source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.sha }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Package backend input JAR
        run: mvn -B -DskipTests package

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build frontend artifact
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image }}
          labels: |
            org.opencontainers.image.revision=${{ steps.meta.outputs.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Stage deployment bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy-bundle
          cp -r frontend/dist deploy-bundle/dist
          cp docs/docker-compose.yaml deploy-bundle/docker-compose.yaml
          cp deploy/nginx.conf deploy-bundle/nginx.conf
          cp deploy/deploy.sh deploy-bundle/deploy.sh
          cp deploy/rollback.sh deploy-bundle/rollback.sh

      - name: Prepare SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload deployment bundle
        shell: bash
        run: |
          rsync -az -e "ssh -i ~/.ssh/ec2_key" \
            deploy-bundle/ ubuntu@${{ secrets.EC2_HOST }}:/home/ubuntu/roboknow/

      - name: Authenticate EC2 to GHCR
        shell: bash
        run: |
          printf '%s' "${{ secrets.GHCR_TOKEN }}" | \
            ssh -i ~/.ssh/ec2_key ubuntu@${{ secrets.EC2_HOST }} \
            "sudo docker login ghcr.io --username '${{ secrets.GHCR_USERNAME }}' --password-stdin"

      - name: Deploy backend image and frontend
        shell: bash
        run: |
          ssh -i ~/.ssh/ec2_key ubuntu@${{ secrets.EC2_HOST }} \
            "sudo env ROBO_BACKEND_IMAGE='${{ steps.meta.outputs.image }}' \
            bash /home/ubuntu/roboknow/deploy.sh"

      - name: Deployment summary
        run: |
          echo "## Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source SHA: ${{ steps.meta.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Backend image: ${{ steps.meta.outputs.image }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Target: EC2 via Docker Compose" >> "$GITHUB_STEP_SUMMARY"
