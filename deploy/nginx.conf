server {
    listen 80;
    server_name _;
    client_max_body_size 100m;

    root /var/www/paismart;
    index index.html;

    # SPA static files
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST API -> backend (controllers already mapped under /api/v1)
    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Chat WebSocket: frontend connects to /proxy-ws/chat/{token},
    # strip /proxy-ws -> backend handler registered at /chat/{token}
    location /proxy-ws/ {
        rewrite ^/proxy-ws/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 600s;
    }
}
