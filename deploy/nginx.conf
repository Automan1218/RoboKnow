server {
    # This deployment owns the public HTTP endpoint. Make the virtual host
    # explicit so requests addressed by the EC2 IP cannot fall back to a
    # distribution/default Nginx page.
    listen 80 default_server;
    server_name _;
    client_max_body_size 100m;
    server_tokens off;

    # Browser-facing hardening. These headers are checked by the post-deploy
    # OWASP ZAP baseline scan and apply to both SPA assets and API responses.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; worker-src 'self' blob:;" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    root /var/www/roboknow;
    index index.html;

    # SPA static files
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST API -> backend (controllers already mapped under /api/v1)
    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Chat WebSocket: frontend connects to /proxy-ws/chat/{token},
    # strip /proxy-ws -> backend handler registered at /chat/{token}
    location /proxy-ws/ {
        rewrite ^/proxy-ws/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 600s;
    }
}
